<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>
/* ── listen.html page styles ── */
body { max-width: 520px; margin: 0 auto }

/* ── Welcome ── */
#scr-welcome {
  min-height: 100dvh;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  padding-block: 56px 48px;
  gap: 0;
}
.welcome-top    { display: flex; flex-direction: column; align-items: center; gap: 32px; flex: 1; justify-content: center }
.welcome-bottom { width: 100% }

.greeting-wrap  { height: 60px; display: flex; align-items: center; justify-content: center }
.greeting-text  {
  font-size: clamp(1.75rem, 7vw, 2.4rem);
  font-weight: 700;
  color: var(--fg);
  opacity: 1;
  transition: opacity 0.35s ease;
}
.greeting-text.fading { opacity: 0 }

/* ── Language ── */
#scr-lang {
  min-height: 100dvh;
  padding-block: 48px 40px;
  gap: 24px;
}
.lang-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 4px;
}
.lang-list { display: flex; flex-direction: column; gap: 10px }
.lang-opt {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  cursor: pointer;
  gap: 14px;
  transition: border-color 0.18s, background 0.18s, transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.lang-opt:hover  { border-color: var(--gold); background: var(--gold-bg) }
.lang-opt:active { transform: scale(0.97) }
.lang-flag-img {
  width: 36px; height: 36px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  font-size: 1.6rem; line-height: 36px; text-align: center;
}
.lang-flag  { font-size: 1.8rem; line-height: 1 }
.lang-texts { flex: 1; text-align: start }
.lang-native{ font-size: 1.1rem; font-weight: 600; line-height: 1.3 }
.lang-sub   { font-size: 0.8rem; color: var(--fg-muted) }

/* ── Waiting ── */
#scr-waiting {
  min-height: 100dvh;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-block: 48px;
  gap: 0;
}
.waiting-body  { display: flex; flex-direction: column; align-items: center; gap: 24px; flex: 1; justify-content: center }
.waiting-illus { width: 160px; height: 160px; object-fit: contain; opacity: 0.9; display: block }

.room-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px }
.room-input {
  text-align: center;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: var(--f-latin);
  font-size: 1.05rem;
  font-weight: 600;
}

/* ── Live ── */
#scr-live  { min-height: 100dvh; padding: 0; gap: 0 }

.live-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
}
.live-mosque-name { font-size: 0.85rem; font-weight: 600; flex: 1; color: var(--fg) }
.live-mosque-sub  { font-size: 0.72rem; color: var(--fg-muted) }
.conn-label { font-size: 0.82rem; font-weight: 500; color: var(--fg-muted) }

.feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.seg {
  border-radius: var(--r);
  padding: 14px 16px;
  font-size: var(--seg-size, 1rem);
  line-height: 1.75;
  background: var(--surface);
  border: 1px solid var(--border);
  animation: seg-in 0.22s ease;
}
@keyframes seg-in { from { opacity: 0; transform: translateY(6px) } }

.seg.is-verse   { padding: 0; overflow: hidden }
.verse-inner    { padding: 14px 16px }
.verse-top-bar  {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; margin-bottom: 10px;
}
.verse-ar  {
  font-size: 1.05em; font-family: var(--f-arabic);
  line-height: 2; direction: rtl; text-align: right;
  border-bottom: 1px solid var(--gold-border);
  padding-bottom: 10px; margin-bottom: 10px;
}
.verse-tr  { line-height: 1.75 }
.verse-credit { font-size: 0.72rem; color: var(--fg-faint); margin-top: 8px }

.seg.is-unclear  { color: var(--fg-faint); font-style: italic; border-style: dashed }
.seg-hadith-tag  { margin-bottom: 8px }

.live-footer-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-width: 520px; margin: 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
}
.live-disclaimer {
  flex: 1;
  font-size: 0.7rem;
  color: var(--fg-faint);
  text-align: center;
  line-height: 1.4;
}

/* ── Disconnection banner ── */
.disc-banner {
  background: var(--warn);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 8px 16px;
  text-align: center;
  display: none;
}
.disc-banner.visible { display: block }

/* ── Ended ── */
#scr-ended {
  min-height: 100dvh;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-block: 48px;
  gap: 20px;
}
.ended-icon {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
}

/* ── Back btn ── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none; border: none;
  color: var(--fg-muted);
  font-family: inherit;
  font-size: 0.875rem;
  cursor: pointer;
  padding: 4px 0;
}
.back-btn:hover { color: var(--fg) }

/* ── Language pill ── */
.lang-pill-btn {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 5px 10px;
  font-family: inherit;
  font-size: 0.78rem; font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.lang-pill-btn:hover { background: var(--surface-2) }
</style>
</head>
<body>

<!-- ── Welcome ─────────────────────────────────────────── -->
<div id="scr-welcome" class="screen">
  <div class="welcome-top">
    <img src="assets/logo-full.png" alt="منبر" class="logo-img-full" style="margin:0 auto">

    <div>
      <div class="greeting-wrap">
        <div id="greeting" class="greeting-text">أهلاً بك</div>
      </div>
      <p class="t-small t-muted" style="margin-top:8px">ترجمة الخطبة فور سماعها</p>
    </div>

    <div id="mosque-card-wrap"></div>
  </div>

  <div class="welcome-bottom stack">
    <button class="btn btn-primary btn-full" onclick="showLang()">ابدأ</button>
    <a href="privacy.html" class="t-micro t-muted" style="text-align:center;display:block">سياسة الخصوصية</a>
  </div>
</div>

<!-- ── Language ────────────────────────────────────────── -->
<div id="scr-lang" class="screen">
  <div class="lang-header">
    <button class="back-btn" onclick="showScreen('welcome')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      رجوع
    </button>
  </div>

  <div>
    <h1 class="t-display" style="font-size:clamp(1.8rem,7vw,2.4rem)">اختر لغتك</h1>
    <p class="t-small t-muted" style="margin-top:6px">Choose your language</p>
  </div>

  <div class="lang-list" id="lang-list">
    <button class="lang-opt" id="lo-ar" onclick="selectLang('ar')">
      <div class="lang-radio"><div class="lang-radio-dot"></div></div>
      <span class="lang-flag">🇸🇦</span>
      <div class="lang-texts">
        <div class="lang-native">العربية (نص الخطبة)</div>
        <div class="lang-sub">لضعاف السمع</div>
      </div>
    </button>
    <button class="lang-opt" id="lo-ur" onclick="selectLang('ur')">
      <div class="lang-radio"><div class="lang-radio-dot"></div></div>
      <span class="lang-flag">🇵🇰</span>
      <div class="lang-texts">
        <div class="lang-native" style="font-family:var(--f-urdu)">اردو</div>
        <div class="lang-sub">Urdu</div>
      </div>
    </button>
    <button class="lang-opt" id="lo-en" onclick="selectLang('en')">
      <div class="lang-radio"><div class="lang-radio-dot"></div></div>
      <span class="lang-flag">🇬🇧</span>
      <div class="lang-texts">
        <div class="lang-native" style="font-family:var(--f-latin)">English</div>
        <div class="lang-sub">الإنجليزية</div>
      </div>
    </button>
    <button class="lang-opt" id="lo-hi" onclick="selectLang('hi')">
      <div class="lang-radio"><div class="lang-radio-dot"></div></div>
      <span class="lang-flag">🇮🇳</span>
      <div class="lang-texts">
        <div class="lang-native" style="font-family:var(--f-hindi)">हिन्दी</div>
        <div class="lang-sub">الهندية</div>
      </div>
    </button>
  </div>

  <button class="btn btn-primary btn-full" id="lang-confirm-btn" disabled onclick="confirmLang()" style="opacity:0.45">متابعة</button>
  <p class="t-micro t-muted" style="text-align:center;display:flex;align-items:center;justify-content:center;gap:5px">
    ⚙️ تُحفَظ لغتك للجمعة القادمة.
  </p>
</div>

<!-- ── Waiting ──────────────────────────────────────────── -->
<div id="scr-waiting" class="screen">
  <div id="waiting-body" class="waiting-body">
    <!-- content injected by JS -->
  </div>
</div>

<!-- ── Live translation ─────────────────────────────────── -->
<div id="scr-live" class="screen">
  <!-- Disconnection banner -->
  <div id="disc-banner" class="disc-banner">
    ⚠️ انقطع الاتصال، جارٍ إعادة الاتصال… لن يفوتك شيء.
  </div>

  <div class="live-header">
    <img src="assets/logo-icon.png" alt="منبر" class="logo-img-icon">
    <div style="flex:1;min-width:0">
      <div class="live-mosque-name" id="header-mosque-name">–</div>
    </div>
    <span id="conn-dot" class="conn-dot disconnected"></span>
    <button class="lang-pill-btn" id="change-lang-btn" onclick="changeLang()"></button>
  </div>

  <!-- Live banner -->
  <div id="live-banner" class="live-banner" style="display:none">
    <span class="conn-dot" style="background:var(--err);width:8px;height:8px;animation:pulse-dot 1.2s ease-in-out infinite"></span>
    مباشر
  </div>

  <div id="feed" class="feed"></div>

  <!-- Scroll-to-bottom fab -->
  <button id="scroll-fab" class="scroll-fab" onclick="scrollToBottom()">
    ↓ العودة إلى الآن
  </button>

  <div class="live-footer-bar">
    <div class="font-ctrl-wrap">
      <button class="font-ctrl" onclick="changeFontSize(-2)" title="تصغير الخط">A−</button>
      <button class="font-ctrl" onclick="changeFontSize(2)"  title="تكبير الخط">A+</button>
    </div>
    <div class="live-disclaimer" id="live-footer"></div>
  </div>
</div>

<!-- ── Ended ─────────────────────────────────────────────── -->
<div id="scr-ended" class="screen">
  <div class="ended-icon">✓</div>
  <h2 class="t-title" id="ended-title"></h2>
  <p class="t-small t-muted" id="ended-sub"></p>
  <p class="t-small" style="color:var(--gold);font-weight:600">تقبّل الله منا ومنكم</p>
  <button class="btn btn-ghost btn-sm" onclick="location.reload()">العودة للبداية</button>
  <a href="privacy.html" class="t-micro t-muted" style="display:block;text-align:center;margin-top:4px">سياسة الخصوصية</a>
</div>

<script>
/* ── Config ── */
const API    = 'http://localhost:8000';
const WS_URL = 'ws://localhost:8000';

/* ── i18n ── */
const T = {
  ar: {
    dir: 'rtl',
    waiting:        'الخطبة لم تبدأ بعد.',
    waitingSub:     'أبقِ الصفحة مفتوحة، وستظهر الترجمة تلقائياً.',
    connected:      'متصل',
    connecting:     'جارٍ الاتصال…',
    disconnected:   'انقطع الاتصال',
    changeLang:     '🌐 العربية',
    endedTitle:     'انتهت الخطبة',
    endedSub:       'تقبّل الله منا ومنكم',
    disclaimer:     'نص آلي من كلام الخطيب، قد يحتوي أخطاء.',
    quranSrc:       'QuranEnc',
    haditLabel:     'حديث كما ذكره الخطيب',
    unclearLabel:   '— غير واضح —',
    roomLabel:      'رمز الجامع',
    roomPlaceholder:'أدخل رمز الجامع',
    joinBtn:        'اتصال',
    roomErr:        'أدخل رمز الجامع',
  },
  en: {
    dir: 'ltr',
    waiting:        'Waiting for the sermon to begin…',
    waitingSub:     'Keep this page open. The translation will appear automatically.',
    connected:      'Connected',
    connecting:     'Connecting…',
    disconnected:   'Disconnected',
    changeLang:     '🌐 English',
    endedTitle:     'The sermon has ended',
    endedSub:       'Thank you for listening',
    disclaimer:     'AI translation · Source: the imam\'s speech',
    quranSrc:       'QuranEnc',
    haditLabel:     'Hadith — as mentioned by the imam',
    unclearLabel:   '— unclear —',
    roomLabel:      'Mosque code',
    roomPlaceholder:'Enter mosque code',
    joinBtn:        'Connect',
    roomErr:        'Please enter the mosque code',
  },
  ur: {
    dir: 'rtl',
    waiting:        'خطبے کے شروع ہونے کا انتظار ہے.',
    waitingSub:     'یہ صفحہ کھلا رکھیں، ترجمہ خود بخود آئے گا.',
    connected:      'منسلک',
    connecting:     'منسلک ہو رہا ہے…',
    disconnected:   'غیر منسلک',
    changeLang:     '🌐 اردو',
    endedTitle:     'خطبہ ختم ہو گیا',
    endedSub:       'سننے کا شکریہ',
    disclaimer:     'مصنوعی ذہانت کا ترجمہ · ماخذ: امام کی تقریر',
    quranSrc:       'QuranEnc',
    haditLabel:     'حدیث — خطیب کے بیان کے مطابق',
    unclearLabel:   '— غیر واضح —',
    roomLabel:      'مسجد کوڈ',
    roomPlaceholder:'کوڈ درج کریں',
    joinBtn:        'شامل ہوں',
    roomErr:        'مسجد کا کوڈ درج کریں',
  },
  hi: {
    dir: 'ltr',
    waiting:        'खुतबे के शुरू होने का इंतज़ार है.',
    waitingSub:     'यह पेज खुला रखें, अनुवाद अपने आप दिखेगा.',
    connected:      'जुड़ा हुआ',
    connecting:     'जोड़ रहा है…',
    disconnected:   'कटा हुआ',
    changeLang:     '🌐 हिन्दी',
    endedTitle:     'खुतबा समाप्त हुआ',
    endedSub:       'सुनने के लिए धन्यवाद',
    disclaimer:     'AI अनुवाद · स्रोत: इमाम का भाषण',
    quranSrc:       'QuranEnc',
    haditLabel:     'हदीस — खतीब के अनुसार',
    unclearLabel:   '— अस्पष्ट —',
    roomLabel:      'मस्जिद कोड',
    roomPlaceholder:'कोड दर्ज करें',
    joinBtn:        'जुड़ें',
    roomErr:        'मस्जिद कोड दर्ज करें',
  },
};

/* ── State ── */
let lang       = null;
let pendingLang= null;
let roomId     = null;
let ws         = null;
let wsDelay    = 1000;
let wsTimer    = null;
let fontSize   = 17;
let curScreen  = null;
let atBottom   = true;

/* ── Init ── */
function init() {
  const params = new URLSearchParams(location.search);
  roomId = params.get('room') || lsGet('mb-room') || null;
  lang   = lsGet('mb-lang');

  if (roomId) {
    const card = document.getElementById('mosque-card-wrap');
    if (card) {
      card.innerHTML = `
        <div class="mosque-card">
          <span class="mosque-icon">🕌</span>
          <div>
            <div class="mosque-name" id="mosque-name-display">${roomId}</div>
          </div>
        </div>`;
    }
    const headerName = document.getElementById('header-mosque-name');
    if (headerName) headerName.textContent = roomId;
  }

  if (lang && T[lang]) {
    applyLang(lang, false);
    buildWaiting();
    showScreen('waiting');
    connectWS();
  } else {
    showScreen('welcome');
    startGreeting();
  }
}

/* ── Screen ── */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('scr-' + name).classList.add('active');
  curScreen = name;
}

function showLang() { showScreen('lang') }

/* ── Language selection (two-step) ── */
let _selectedLang = null;

function selectLang(l) {
  _selectedLang = l;
  document.querySelectorAll('.lang-opt').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('lo-' + l);
  if (el) el.classList.add('selected');
  const btn = document.getElementById('lang-confirm-btn');
  if (btn) { btn.disabled = false; btn.style.opacity = '1' }
}

function confirmLang() {
  if (!_selectedLang) return;
  chooseLang(_selectedLang);
}

function chooseLang(l) {
  applyLang(l, true);
  buildWaiting();
  showScreen('waiting');
  connectWS();
}

function changeLang() {
  if (ws) { ws.onclose = null; ws.close() }
  lsSet('mb-lang', null);
  lang = null;
  _selectedLang = null;
  document.querySelectorAll('.lang-opt').forEach(el => el.classList.remove('selected'));
  const btn = document.getElementById('lang-confirm-btn');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.45' }
  document.documentElement.lang = 'ar';
  document.documentElement.dir  = 'rtl';
  showScreen('lang');
}

function applyLang(l, save) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l === 'ur' ? 'ur' : l === 'hi' ? 'hi' : l === 'ar' ? 'ar' : 'en';
  document.documentElement.dir  = t.dir;
  if (save) lsSet('mb-lang', l);

  document.body.className = l === 'en' ? 'lang-en' : l === 'hi' ? 'lang-hi' : '';

  const clBtn = document.getElementById('change-lang-btn');
  if (clBtn) clBtn.textContent = t.changeLang;
  const footer = document.getElementById('live-footer');
  if (footer) footer.textContent = t.disclaimer;
  const endTitle = document.getElementById('ended-title');
  if (endTitle) endTitle.textContent = t.endedTitle;
  const endSub = document.getElementById('ended-sub');
  if (endSub) endSub.textContent = t.endedSub;
}

/* ── Waiting screen ── */
function buildWaiting() {
  const t = T[lang] || T.en;
  const body = document.getElementById('waiting-body');
  body.innerHTML = '';

  if (!roomId) {
    body.innerHTML = `
      <div class="stack" style="gap:10px;width:100%;max-width:300px;text-align:start">
        <label class="t-small" style="font-weight:600">${t.roomLabel}</label>
        <input id="room-input" class="field-input room-input" type="text"
               maxlength="20" placeholder="${t.roomPlaceholder}"
               autocomplete="off" spellcheck="false">
        <div id="room-err" class="err-msg"></div>
        <button class="btn btn-primary btn-full" onclick="joinRoom()">${t.joinBtn}</button>
      </div>
    `;
    document.getElementById('room-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinRoom();
    });
  } else {
    body.innerHTML = `
      <img src="assets/logo-icon.png" alt="" class="waiting-illus" aria-hidden="true">
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
        <p class="t-title" style="font-size:clamp(1.3rem,5vw,1.8rem)">${t.waiting}</p>
        <p class="t-small t-muted" style="max-width:280px">${t.waitingSub}</p>
      </div>
      <div class="row" style="justify-content:center;gap:8px">
        <span id="conn-dot-w" class="conn-dot connecting"></span>
        <span id="conn-label-w" class="t-small" style="color:var(--fg-muted)">${t.connecting}</span>
      </div>
    `;
  }
}

function joinRoom() {
  const input = document.getElementById('room-input');
  const val   = (input.value || '').trim().toUpperCase();
  if (!val) {
    document.getElementById('room-err').textContent = (T[lang] || T.en).roomErr;
    return;
  }
  roomId = val;
  lsSet('mb-room', val);
  const headerName = document.getElementById('header-mosque-name');
  if (headerName) headerName.textContent = roomId;
  buildWaiting();
  connectWS();
}

/* ── WebSocket ── */
function connectWS() {
  if (!roomId) return;
  clearTimeout(wsTimer);
  try { ws && ws.close() } catch {}

  ws = new WebSocket(`${WS_URL}/ws/${roomId}`);
  setConnState('connecting');

  ws.onopen  = () => { setConnState('connected'); wsDelay = 1000 };
  ws.onclose = () => {
    setConnState('disconnected');
    if (curScreen === 'live') {
      document.getElementById('disc-banner').classList.add('visible');
    }
    wsTimer = setTimeout(() => {
      wsDelay = Math.min(wsDelay * 2, 30000);
      connectWS();
    }, wsDelay);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    try { handleMsg(JSON.parse(e.data)) } catch {}
  };
}

function setConnState(state) {
  const t = T[lang] || T.en;
  if (state === 'connected') {
    document.getElementById('disc-banner')?.classList.remove('visible');
  }
  ['', '-w'].forEach(sfx => {
    const dot   = document.getElementById('conn-dot'   + sfx);
    const label = document.getElementById('conn-label' + sfx);
    if (dot)   { dot.className = 'conn-dot ' + state }
    if (label) { label.textContent = t[state] || state }
  });
}

function handleMsg(msg) {
  if (!msg || !msg.type) return;
  if (msg.type === 'started') {
    document.getElementById('live-banner').style.display = 'flex';
    showScreen('live');
    return;
  }
  if (msg.type === 'ended') {
    document.getElementById('live-banner').style.display = 'none';
    showScreen('ended');
    return;
  }
  if (msg.type === 'segment') {
    if (curScreen !== 'live') showScreen('live');
    document.getElementById('live-banner').style.display = 'flex';
    appendSeg(msg);
  }
}

/* ── Feed ── */
function appendSeg(msg) {
  const feed = document.getElementById('feed');
  const t    = T[lang] || T.en;
  const text = lang === 'ar' ? (msg.ar || '') : (msg[lang] || msg.en || msg.ar || '');

  // Remove "current" from previous last segment
  const prevCurrent = feed.querySelector('.seg.is-current');
  if (prevCurrent) prevCurrent.classList.remove('is-current');

  const el = document.createElement('div');
  const timeStr = formatTime(msg.ts);

  if (msg.verse) {
    el.className = 'seg is-verse card-verse is-current';
    const v = msg.verse;
    el.innerHTML = `
      <div class="verse-inner">
        <div class="verse-top-bar">
          <span class="badge badge-gold">📖 ${v.sura_name_ar || ''} ${v.sura}:${v.ayah}</span>
          <span class="badge badge-gray">${t.quranSrc}</span>
          <span class="seg-ts" style="margin-inline-start:auto">${timeStr}</span>
        </div>
        <div class="verse-ar">${msg.ar || ''}</div>
        <div class="verse-tr">${text}</div>
        <div class="verse-credit">${v.translator || ''} · ${v.version || ''}</div>
      </div>`;
  } else if (msg.is_unclear) {
    el.className = 'seg is-unclear is-current';
    el.innerHTML = `<div class="seg-now-bar"><span>${t.unclearLabel}</span><span class="seg-ts">${timeStr}</span></div>`;
  } else {
    el.className = 'seg is-current';
    if (msg.is_hadith) {
      el.innerHTML = `
        <div class="seg-now-bar">
          <div class="seg-hadith-tag"><span class="badge badge-green">📜 ${t.haditLabel}</span></div>
          <span class="seg-ts">${timeStr}</span>
        </div>
        <div>${text}</div>`;
    } else {
      el.innerHTML = `
        <div class="seg-now-bar">
          <span class="badge badge-green" style="font-size:0.68rem">الآن</span>
          <span class="seg-ts">${timeStr}</span>
        </div>
        <div style="font-size:1.05em;font-weight:500">${text}</div>`;
    }
  }

  el.style.fontSize = fontSize + 'px';
  if (lang === 'ur') el.classList.add('lang-ur');
  else if (lang === 'hi') el.classList.add('lang-hi');
  else if (lang === 'en') el.classList.add('lang-en');

  feed.appendChild(el);

  if (atBottom) {
    requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight });
  }
}

/* ── Feed scroll tracking ── */
function setupScrollTracking() {
  const feed = document.getElementById('feed');
  if (!feed) return;
  feed.addEventListener('scroll', () => {
    const threshold = 80;
    atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < threshold;
    const fab = document.getElementById('scroll-fab');
    if (fab) fab.classList.toggle('visible', !atBottom);
  });
}

function scrollToBottom() {
  const feed = document.getElementById('feed');
  if (feed) { feed.scrollTop = feed.scrollHeight; atBottom = true }
  const fab = document.getElementById('scroll-fab');
  if (fab) fab.classList.remove('visible');
}

/* ── Font size ── */
function changeFontSize(delta) {
  fontSize = Math.min(Math.max(fontSize + delta, 13), 28);
  document.querySelectorAll('.seg').forEach(s => s.style.fontSize = fontSize + 'px');
  document.documentElement.style.setProperty('--seg-size', fontSize + 'px');
}

/* ── Time formatting ── */
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const h = d.getHours(), m = d.getMinutes();
  const suffix = h >= 12 ? 'م' : 'ص';
  const hh = h % 12 || 12;
  return `${hh}:${String(m).padStart(2,'0')} ${suffix}`;
}

/* ── Greeting rotation ── */
function startGreeting() {
  const greetings = [
    { text: 'أهلاً بك',    dir: 'rtl', cls: '' },
    { text: 'Welcome',      dir: 'ltr', cls: 'lang-en' },
    { text: 'خوش آمدید',   dir: 'rtl', cls: '' },
    { text: 'स्वागत है',    dir: 'ltr', cls: 'lang-hi' },
  ];
  let i = 0;
  const el = document.getElementById('greeting');

  setInterval(() => {
    el.classList.add('fading');
    setTimeout(() => {
      i = (i + 1) % greetings.length;
      const g = greetings[i];
      el.textContent  = g.text;
      el.dir          = g.dir;
      el.className    = 'greeting-text' + (g.cls ? ' ' + g.cls : '');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('fading')));
    }, 350);
  }, 2200);
}

/* ── localStorage helpers ── */
function lsGet(k)    { try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v) } catch {} }

/* ── Boot ── */
setupScrollTracking();
init();
</script>
