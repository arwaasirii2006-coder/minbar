<!doctype html>
<html lang="ar" dir="rtl" data-i18n-title="title.listen">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5847">
<title>منبر — المصلّي</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<main class="app">

<section id="welcome" class="screen">
  <div class="topbar"><div data-ui-lang></div></div>
  <div class="hero">
    <img src="assets/logo-full.png" class="logo-full" alt="منبر">
    <div class="greeting"><h1 id="greeting" lang="ar">أهلاً بك</h1></div>
    <div class="mosque-card">
      <svg class="i pin" aria-hidden="true"><use href="assets/icons.svg#pin"/></svg>
      <div class="txt"><strong class="js-mosque-name"></strong><small class="js-mosque-location"></small></div>
      <div class="mosque-icon-box"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#mosque"/></svg></div>
    </div>
    <p data-i18n="home.desc"></p>
    <div class="actions"><button class="btn primary" onclick="goLanguage()"><span data-i18n="listen.start"></span> <svg class="i chev" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button></div>
  </div>
</section>

<section id="language" class="screen">
  <div class="topbar"><div data-ui-lang></div></div>
  <img src="assets/logo-icon.png" class="logo-icon" alt="">
  <div class="hero" style="margin:0">
    <h1 style="margin-bottom:2px" data-i18n="listen.chooseTitle"></h1>
    <p style="font-size:16px" data-i18n="listen.chooseSub"></p>
  </div>
  <div class="language-list" role="radiogroup" data-i18n-aria-label="listen.sermonLanguage">
    <button class="lang-option" role="radio" data-lang="ar" onclick="selectLang('ar')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-sa"/></svg><span><strong><span lang="ar" dir="rtl">العربية</span> <span data-i18n="listen.arabicNote"></span></strong><small data-i18n="listen.arabicSub"></small></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="ur" onclick="selectLang('ur')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-pk"/></svg><span class="alt"><strong class="lang-ur" lang="ur" dir="rtl">اردو</strong></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="en" onclick="selectLang('en')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-gb"/></svg><span class="alt"><strong class="lang-en" lang="en" dir="ltr">English</strong></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="hi" onclick="selectLang('hi')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-in"/></svg><span class="alt"><strong class="lang-hi" lang="hi" dir="ltr">हिन्दी</strong></span><span class="radio"></span></button>
  </div>
  <button class="btn primary pill" onclick="confirmLanguage()"><span data-i18n="listen.continue"></span> <svg class="i chev" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button>
  <div class="note"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#gear"/></svg> <span data-i18n="listen.sessionNote"></span></div>
</section>

<section id="waiting" class="screen center waiting">
  <div class="hero">
    <img src="assets/logo-icon.png" class="waiting-illustration" alt="">
    <h1 id="waiting-title"></h1>
    <p id="waiting-sub"></p>
    <div class="connection"><span class="dot amber" id="conn-dot"></span><span id="conn-text"></span></div>
  </div>
</section>

<section id="live" class="screen live">
  <header class="live-head">
    <div class="live-head-main">
      <img src="assets/logo-icon.png" class="logo-icon-small" alt="منبر">
      <div class="mosque-name"><strong class="js-mosque-name"></strong><small class="js-mosque-location"></small></div>
      <button class="lang-pill js-sermon-pill" onclick="goLanguage()"></button>
    </div>
    <div class="live-status"><span data-i18n="listen.live"></span><span class="dot red blink"></span></div>
    <div class="disconnect"><span data-i18n="listen.disc"></span><small data-i18n="listen.discSub"></small></div>
  </header>
  <div class="feed-title" data-i18n="listen.feedTitle"></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="live-tools">
    <div class="tool-row">
      <button class="now-btn hidden" id="now-btn" onclick="scrollToLatest()"><span data-i18n="listen.latest"></span><span class="arrow"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#arrow-down"/></svg></span></button>
      <button class="circle-btn" dir="ltr" onclick="changeFont(2)" data-i18n-aria-label="listen.fontUp">A+</button>
      <button class="circle-btn" dir="ltr" onclick="changeFont(-2)" data-i18n-aria-label="listen.fontDown">A−</button>
    </div>
    <div class="disclaimer" id="disclaimer"></div>
  </div>
</section>

<section id="ended" class="screen ended">
  <div class="check">✓</div>
  <h1 data-i18n="listen.ended"></h1>
  <p class="dua" data-i18n="listen.dua"></p>
  <div class="rating">
    <strong data-i18n="listen.rating"></strong>
    <div class="stars" id="stars"></div>
    <div class="thanks" id="thanks"></div>
  </div>
  <button class="btn primary" onclick="showReplay()" data-i18n="listen.replay"></button>
  <a class="privacy-link" href="privacy.html" data-i18n="common.privacy"></a>
</section>

<section id="replay" class="screen replay">
  <div class="topbar"><button class="lang-pill js-sermon-pill" onclick="goLanguage()"></button></div>
  <div class="hero" style="margin:10px 0 14px;text-align:start"><h1 data-i18n="listen.replay"></h1><p class="js-mosque-name"></p></div>
  <div class="feed" id="replay-feed"></div>
  <button class="btn secondary" onclick="leaveReplay()" data-i18n="common.back"></button>
</section>

</main>
<script>
// Two independent languages:
//   I18N.lang  interface language (all labels, messages, direction of the page)
//   lang       sermon translation language (content of the sermon cards only)
const t = I18N.t;
const SESSION_SCREENS = ['waiting', 'live', 'ended'];
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

let room = (params.get('room') || '').trim().toUpperCase();
let lang = store('minbar.lang');
let selected = lang || 'ar';
let ws = null, retry = 1000, retryTimer = null, pingTimer = null, connState = 'connecting';
let status = 'READY', session = 0, lastSeq = 0, segments = [];
let current = null, returnTo = null, unknownRoom = false, serverUnreachable = false;
let font = 18, rating = 0;

// The sermon language lives in sessionStorage only (cleared when the tab closes).
function store(key, value) {
  try {
    if (value === undefined) return sessionStorage.getItem(key);
    sessionStorage.setItem(key, value);
  } catch { return null; }
}
const sermon = () => I18N.LANGS[lang] || I18N.LANGS.ar;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
// Content written in the sermon language keeps its own script direction and font.
function content(tag, cls, text, code = lang) {
  const node = el(tag, cls + ' lang-' + code, text);
  node.lang = code;
  node.dir = (I18N.LANGS[code] || I18N.LANGS.ar).dir;
  return node;
}

const SVG = 'http://www.w3.org/2000/svg';
function icon(name, cls = '') {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('class', ('i ' + cls).trim());
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(SVG, 'use');
  use.setAttribute('href', 'assets/icons.svg#' + name);
  svg.append(use);
  return svg;
}
function badge(cls, name, text) {
  const b = el('span', 'badge ' + cls);
  b.append(icon(name), document.createTextNode(' ' + text));
  return b;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  current = id;
  window.scrollTo(0, id === 'live' ? document.body.scrollHeight : 0);
  updateNowButton();
}
const screenForStatus = () => status === 'LIVE' ? 'live' : status === 'ENDED' ? 'ended' : 'waiting';
const inSession = () => SESSION_SCREENS.includes(current);

/* ── texts that depend on state or on the sermon language ── */
function renderSermonPills() {
  const L = sermon();
  document.querySelectorAll('.js-sermon-pill').forEach(b => {
    const name = el('span', '', L.name);
    name.lang = lang || 'ar';
    name.dir = L.dir;
    b.replaceChildren(icon('chevron-down', 'chev'), document.createTextNode(' '), name, document.createTextNode(' '), icon('globe'));
    b.setAttribute('aria-label', t('listen.sermonLanguage') + ': ' + L.name);
  });
}
function renderWaitingText() {
  let title = t('listen.waiting'), sub = t('listen.waitingSub');
  if (unknownRoom) { title = t('listen.unknownRoom'); sub = ''; }
  else if (serverUnreachable) { title = t('listen.disconnected'); sub = I18N.error('offline'); }
  $('waiting-title').textContent = title;
  $('waiting-sub').textContent = sub;
}
function renderTexts() {
  renderSermonPills();
  renderWaitingText();
  setConn(connState);
  $('disclaimer').textContent = t(lang === 'ar' ? 'listen.disclaimerTranscript' : 'listen.disclaimerTranslation');
  renderStars(rating);
  $('thanks').textContent = rating ? t('listen.thanks') : '';
}
function setMosque(name, location) {
  document.querySelectorAll('.js-mosque-name').forEach(n => { n.textContent = name || ''; });
  document.querySelectorAll('.js-mosque-location').forEach(n => { n.textContent = location || ''; });
}

// Interface language changed: update every dynamic text in place, no reload.
window.addEventListener('minbar:lang', () => {
  renderTexts();
  renderFeed();
  if (current === 'replay') showReplay();
});

/* ── welcome ── */
function startGreeting() {
  const items = [['أهلاً بك', 'ar'], ['Welcome', 'en'], ['خوش آمدید', 'ur'], ['स्वागत है', 'hi']];
  const h = $('greeting');
  let i = 0;
  setInterval(() => {
    if (current !== 'welcome') return;
    h.classList.add('fade');
    setTimeout(() => {
      i = (i + 1) % items.length;
      h.textContent = items[i][0];
      h.className = 'lang-' + items[i][1] + ' fade';
      h.lang = items[i][1];
      h.dir = I18N.LANGS[items[i][1]].dir;
      requestAnimationFrame(() => h.classList.remove('fade'));
    }, 350);
  }, 2000);
}

/* ── sermon language ── */
function goLanguage() {
  returnTo = inSession() || current === 'replay' ? current : null;
  selectLang(lang || selected);
  show('language');
}
function selectLang(l) {
  selected = l;
  document.querySelectorAll('.lang-option').forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle('selected', on);
    b.setAttribute('aria-checked', on);
  });
}
function confirmLanguage() {
  const changed = selected !== lang;
  lang = selected;
  store('minbar.lang', lang);
  renderTexts();
  if (ws && ws.readyState === 1) {
    if (changed) ws.send(JSON.stringify({type: 'language', language: lang}));
    renderFeed();
    if (returnTo === 'replay') return showReplay();
    return show(returnTo || screenForStatus());
  }
  enterSession();
}
function enterSession() {
  renderTexts();
  show(screenForStatus());
  if (unknownRoom) return showUnknownRoom();
  if (serverUnreachable) return showServerUnreachable();
  connect();
}

/* ── connection ── */
function wsUrl() {
  const q = new URLSearchParams({role: 'listener', language: lang, since: lastSeq, session});
  return MINBAR.wsUrl('/ws/' + encodeURIComponent(room) + '?' + q);
}
function connect() {
  clearTimeout(retryTimer);
  if (unknownRoom) return;
  if (ws && ws.readyState <= 1) return;
  setConn('connecting');
  const sock = ws = new WebSocket(wsUrl());
  sock.onopen = () => {
    retry = 1000;
    setConn('connected');
    clearInterval(pingTimer);
    pingTimer = setInterval(() => { if (sock.readyState === 1) sock.send('{"type":"ping"}'); }, 25000);
  };
  sock.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } handle(m); };
  sock.onclose = e => {
    if (sock !== ws) return;
    clearInterval(pingTimer);
    if (e.code === 4404) { unknownRoom = true; return showUnknownRoom(); }
    setConn('disconnected');
    retryTimer = setTimeout(connect, retry + Math.random() * 500);
    retry = Math.min(retry * 2, 15000);
  };
}
function reconnectNow() {
  if (!lang || unknownRoom) return;
  if (!ws || ws.readyState > 1) { retry = 1000; connect(); }
}
addEventListener('online', reconnectNow);
document.addEventListener('visibilitychange', () => { if (!document.hidden) reconnectNow(); });

function setConn(state) {
  connState = state;
  $('conn-dot').className = 'dot' + (state === 'disconnected' ? ' red' : state === 'connecting' ? ' amber' : '');
  $('conn-text').textContent = t('listen.' + state);
  $('live').classList.toggle('offline', state === 'disconnected');
}
function showServerUnreachable() {
  show('waiting');
  renderWaitingText();
  setConn('disconnected');
}
function showUnknownRoom() {
  show('waiting');
  renderWaitingText();
  setConn('disconnected');
}

function resetSession(newSession) {
  session = newSession || 0;
  segments = [];
  lastSeq = 0;
  $('feed').replaceChildren();
}

function handle(m) {
  switch (m.type) {
    case 'state':
      if (m.name) setMosque(m.name, m.location);
      if (m.session !== session) resetSession(m.session);
      status = m.status;
      if (inSession()) show(screenForStatus());
      break;
    case 'history':
      (m.segments || []).forEach(s => addSegment(s, false));
      if (current === 'live') scrollToLatest(false);
      break;
    case 'started':
      resetSession(m.session);
      status = 'LIVE';
      if (inSession()) show('live');
      break;
    case 'segment':
      status = 'LIVE';
      if (current === 'waiting') show('live');
      addSegment(m, true);
      break;
    case 'ended':
      status = 'ENDED';
      if (inSession()) show('ended');
      break;
    case 'error':
      if (m.code === 'unknown_room') { unknownRoom = true; showUnknownRoom(); }
      break;
  }
}

/* ── feed ── */
function addSegment(seg, live) {
  if (seg.seq <= lastSeq) return;
  lastSeq = seg.seq;
  segments.push(seg);
  const feed = $('feed');
  const follow = live && current === 'live' && atBottom();
  const card = renderSegment(seg, true);
  // The green "current" frame stays on the latest real sentence (not on unclear audio).
  if (card.classList.contains('current')) {
    feed.querySelectorAll('.sermon-card.current').forEach(prev => { prev.classList.remove('current'); prev.querySelector('.badge.now')?.remove(); });
  }
  feed.appendChild(card);
  if (follow) scrollToLatest(true);
  updateNowButton();
}
function renderFeed() {
  let lastReal = -1;
  segments.forEach((s, i) => { if (!s.is_unclear) lastReal = i; });
  $('feed').replaceChildren(...segments.map((s, i) => renderSegment(s, i === lastReal)));
}

function timeOf(ts) {
  try { return new Date(ts || Date.now()).toLocaleTimeString(I18N.locale, {hour: 'numeric', minute: '2-digit'}); }
  catch { return ''; }
}

function renderSegment(seg, isCurrent) {
  const card = el('article', 'sermon-card');
  const meta = el('div', 'card-meta');
  const badges = el('div', 'badges');
  meta.append(badges, el('span', 'time', timeOf(seg.ts)));
  card.append(meta);
  const failed = lang !== 'ar' && (seg.failed_languages || []).includes(lang);
  const ui = I18N.lang;

  if (seg.is_unclear) {
    card.classList.add('unclear');
    badges.append(badge('unclear', 'wave', t('listen.unclear')));
    card.append(el('div', 'seg-text', t('listen.unclearText')));
    return card;
  }

  if (seg.verse) {
    const v = seg.verse;
    card.classList.add('quran');
    const sura = ui === 'en' || ui === 'hi' ? (v.sura_name_en || v.sura_name) : v.sura_name;
    badges.append(badge('quran', 'book', t('listen.quran')), el('span', 'sura-ref', `${t('listen.sura')} ${sura} (${v.ayah})`));
    const ctx = v.context;
    const parts = (seg.parts || {})[lang];
    // Without an AI translation of the khateeb's surrounding words, show them in Arabic.
    const addCtx = key => {
      if (!ctx || v.verse_only || !ctx[key]) return;
      if (lang !== 'ar' && parts && parts[key]) card.append(content('div', 'seg-text ctx', parts[key]));
      else card.append(content('div', 'seg-text ctx', ctx[key], 'ar'));
    };
    addCtx('before');
    card.append(content('div', 'card-quran', '﴿' + (v.arabic || seg.arabic) + '﴾', 'ar'));
    if (lang !== 'ar' && (v.translations || {})[lang]) {
      card.append(content('div', 'card-tr', v.translations[lang]));
      const src = (v.sources || {})[lang] || {};
      const translator = (ui === 'ar' || ui === 'ur') && src.translator_ar ? src.translator_ar : (src.translator || '');
      const source = el('div', 'card-source');
      source.append(icon('book'), document.createTextNode(` ${t('listen.translationOf')} — ${translator} | QuranEnc`));
      card.append(source);
    } else if (lang === 'ar') {
      card.append(el('div', 'card-source', t('listen.quranSource')));
    }
    addCtx('after');
    if (failed) card.append(el('div', 'fail-note', t('listen.failNote')));
    if (isCurrent) { card.classList.add('current'); badges.prepend(badge('now', 'wave', t('listen.now'))); }
    return card;
  }

  if (seg.is_hadith) badges.append(badge('hadith', 'book', t('listen.hadith')));
  const arabic = lang === 'ar' || failed;
  card.append(content('div', 'seg-text', arabic ? seg.arabic : ((seg.translations || {})[lang] || seg.arabic), arabic ? 'ar' : lang));
  if (failed) card.append(el('div', 'fail-note', t('listen.failNote')));
  if (isCurrent) { card.classList.add('current'); badges.prepend(badge('now', 'wave', t('listen.now'))); }
  return card;
}

/* ── tools ── */
function changeFont(delta) {
  font = Math.max(16, Math.min(30, font + delta));
  document.documentElement.style.setProperty('--seg-font', font + 'px');
}
const atBottom = () => innerHeight + scrollY >= document.body.scrollHeight - 160;
function scrollToLatest(smooth = true) {
  window.scrollTo({top: document.body.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
}
function updateNowButton() {
  $('now-btn').classList.toggle('hidden', !(current === 'live' && segments.length && !atBottom()));
}
addEventListener('scroll', updateNowButton, {passive: true});

/* ── ended + replay ── */
function renderStars(n) {
  const box = $('stars');
  box.replaceChildren(...[1, 2, 3, 4, 5].map(i => {
    const b = el('button', 'star' + (i <= n ? ' on' : ''), '★');
    b.setAttribute('aria-label', String(i));
    b.onclick = () => { rating = i; renderStars(i); $('thanks').textContent = t('listen.thanks'); };
    return b;
  }));
}
async function showReplay() {
  show('replay');
  const box = $('replay-feed');
  box.replaceChildren(el('p', 'empty-note', '…'));
  let list = segments;
  try {
    const r = await fetch(MINBAR.url('/broadcast/' + encodeURIComponent(room) + '/replay'));
    if (r.ok) list = (await r.json()).segments || [];
  } catch {
    if (!list.length) { box.replaceChildren(el('p', 'empty-note', t('listen.replayFailed'))); return; }
  }
  box.replaceChildren(...(list.length ? list.map(s => renderSegment(s, false)) : [el('p', 'empty-note', t('listen.replayEmpty'))]));
}
function leaveReplay() { show(ws ? screenForStatus() : 'ended'); }

/* ── boot ── */
async function init() {
  startGreeting();
  selectLang(selected);
  renderTexts();
  if (!room) {
    try { room = ((await (await fetch(MINBAR.url('/broadcast/mosques'))).json()).mosques[0] || {}).id || ''; } catch {}
  }
  try {
    const r = await fetch(MINBAR.url('/broadcast/' + encodeURIComponent(room)));
    if (r.status === 404) unknownRoom = true;
    else if (r.ok) { const s = await r.json(); setMosque(s.name, s.location); status = s.status; session = s.session; }
    else serverUnreachable = true;
  } catch { serverUnreachable = true; }

  if (params.get('replay')) {
    lang = lang || 'ar';
    renderTexts();
    connect();
    return showReplay();
  }
  if (params.get('step') === 'language') return goLanguage();
  if (lang && I18N.LANGS[lang]) return enterSession();
  show('welcome');
}
init();
</script>
</body>
</html>
