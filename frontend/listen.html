<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5847">
<title>منبر — المصلّي</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
</head>
<body>
<main class="app">

<section id="welcome" class="screen" dir="rtl" lang="ar">
  <div class="topbar"><button class="lang-pill" onclick="goLanguage()"><svg class="i chev" aria-hidden="true"><use href="assets/icons.svg#chevron-down"/></svg> العربية <svg class="i" aria-hidden="true"><use href="assets/icons.svg#globe"/></svg></button></div>
  <div class="hero">
    <img src="assets/logo-full.png" class="logo-full" alt="منبر">
    <div class="greeting"><h1 id="greeting">أهلاً بك</h1></div>
    <div class="mosque-card">
      <svg class="i pin" aria-hidden="true"><use href="assets/icons.svg#pin"/></svg>
      <div class="txt"><strong class="js-mosque-name"></strong><small class="js-mosque-location"></small></div>
      <div class="mosque-icon-box"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#mosque"/></svg></div>
    </div>
    <p>منبر يتيح لك الاستماع إلى خطبة الجمعة مترجمة بعدة لغات، ليربطك بقيم الجمعة ومعانيها.</p>
    <div class="actions"><button class="btn primary" onclick="goLanguage()">ابدأ <svg class="i chev" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button></div>
  </div>
</section>

<section id="language" class="screen" dir="rtl" lang="ar">
  <img src="assets/logo-icon.png" class="logo-icon" alt="">
  <div class="hero" style="margin:0">
    <h1 style="margin-bottom:2px">اختر لغتك</h1>
    <p lang="en" style="font-family:var(--f-en);font-size:16px">Choose your language</p>
  </div>
  <div class="language-list" role="radiogroup" aria-label="اختر لغتك">
    <button class="lang-option" role="radio" data-lang="ar" onclick="selectLang('ar')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-sa"/></svg><span><strong>العربية (نص الخطبة)</strong><small>لضعاف السمع</small></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="ur" onclick="selectLang('ur')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-pk"/></svg><span class="alt"><strong class="lang-ur">اردو</strong></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="en" onclick="selectLang('en')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-gb"/></svg><span class="alt"><strong class="lang-en" dir="ltr">English</strong></span><span class="radio"></span></button>
    <button class="lang-option" role="radio" data-lang="hi" onclick="selectLang('hi')"><svg class="flag" aria-hidden="true"><use href="assets/icons.svg#flag-in"/></svg><span class="alt"><strong class="lang-hi" dir="ltr">हिन्दी</strong></span><span class="radio"></span></button>
  </div>
  <button class="btn primary pill" onclick="confirmLanguage()">متابعة <svg class="i chev" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button>
  <div class="note"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#gear"/></svg> لن تحتاج لاختيار لغتك مرة أخرى خلال هذه الجلسة.</div>
</section>

<section id="waiting" class="screen center waiting">
  <div class="hero">
    <img src="assets/logo-icon.png" class="waiting-illustration" alt="">
    <h1 data-t="waiting"></h1>
    <p data-t="waitingSub"></p>
    <div class="connection"><span class="dot amber" id="conn-dot"></span><span id="conn-text"></span></div>
  </div>
</section>

<section id="live" class="screen live">
  <header class="live-head">
    <div class="live-head-main">
      <img src="assets/logo-icon.png" class="logo-icon-small" alt="منبر">
      <div class="mosque-name"><strong class="js-mosque-name"></strong><small class="js-mosque-location"></small></div>
      <button class="lang-pill js-lang-pill" onclick="goLanguage()"></button>
    </div>
    <div class="live-status"><span data-t="live"></span><span class="dot red blink"></span></div>
    <div class="disconnect"><span data-t="disc"></span><small data-t="discSub"></small></div>
  </header>
  <div class="feed-title" data-t="feedTitle"></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="live-tools">
    <div class="tool-row">
      <button class="now-btn hidden" id="now-btn" onclick="scrollToLatest()"><span data-t="backNow"></span><span class="arrow"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#arrow-down"/></svg></span></button>
      <button class="circle-btn" onclick="changeFont(2)" aria-label="A+">A+</button>
      <button class="circle-btn" onclick="changeFont(-2)" aria-label="A−">A−</button>
    </div>
    <div class="disclaimer" data-t="disclaimer"></div>
  </div>
</section>

<section id="ended" class="screen ended">
  <div class="check">✓</div>
  <h1 data-t="ended"></h1>
  <p class="dua" data-t="dua"></p>
  <div class="rating">
    <strong data-t="rating"></strong>
    <div class="stars" id="stars"></div>
    <div class="thanks" id="thanks"></div>
  </div>
  <button class="btn primary" onclick="showReplay()" data-t="replayBtn"></button>
  <a class="privacy-link" href="privacy.html" data-t="privacy"></a>
</section>

<section id="replay" class="screen replay">
  <div class="topbar"><button class="lang-pill js-lang-pill" onclick="goLanguage()"></button></div>
  <div class="hero" style="margin:10px 0 14px;text-align:start"><h1 data-t="replayTitle"></h1><p class="js-mosque-name"></p></div>
  <div class="feed" id="replay-feed"></div>
  <button class="btn secondary" onclick="leaveReplay()" data-t="back"></button>
</section>

</main>
<script>
const LANGS = {
  ar: {label: 'العربية', dir: 'rtl', locale: 'ar-SA-u-nu-latn'},
  ur: {label: 'اردو', dir: 'rtl', locale: 'ur-PK'},
  en: {label: 'English', dir: 'ltr', locale: 'en-US'},
  hi: {label: 'हिन्दी', dir: 'ltr', locale: 'hi-IN'},
};
const T = {
  ar: {waiting:'الخطبة لم تبدأ بعد.', waitingSub:'أبقِ الصفحة مفتوحة، وستظهر الترجمة تلقائياً.', connected:'متصل', connecting:'جارٍ الاتصال…', disconnected:'انقطع الاتصال', live:'مباشر', disc:'انقطع الاتصال، جارٍ إعادة الاتصال.', discSub:'لن يفوتك شيء.', disclaimer:'نص آلي من كلام الخطيب، قد يحتوي أخطاء.', feedTitle:'سجل الخطبة', now:'الآن', quran:'قرآن', hadith:'حديث كما ذكره الخطيب', unclear:'غير واضح', unclearText:'لم يتم التعرف على هذا الجزء من الخطبة بوضوح.', ended:'انتهت الخطبة.', dua:'تقبّل الله منا ومنكم.', rating:'ما مدى وضوح الترجمة؟', thanks:'شكرًا لك.', replayBtn:'إعادة قراءة الخطبة', replayTitle:'إعادة قراءة الخطبة', back:'العودة', backNow:'آخر الخطبة', empty:'لا توجد نسخة مؤقتة من الخطبة.', loadFail:'تعذّر تحميل الخطبة.', failNote:'تعذّرت الترجمة الآلية لهذا الجزء، ويظهر النص العربي.', unknownRoom:'رابط الجامع غير صحيح.', sura:'سورة', quranSource:'النص القرآني: مجمع الملك فهد لطباعة المصحف الشريف', translationOf:'ترجمة معاني القرآن الكريم', privacy:'سياسة الخصوصية'},
  en: {waiting:'The sermon has not started yet.', waitingSub:'Keep this page open. The translation will appear automatically.', connected:'Connected', connecting:'Connecting…', disconnected:'Disconnected', live:'LIVE', disc:'Connection lost. Reconnecting…', discSub:'You won’t miss anything.', disclaimer:'AI machine translation. The khateeb’s words are the reference.', feedTitle:'Sermon log', now:'Now', quran:'Quran', hadith:'Hadith as cited by the khateeb', unclear:'Unclear', unclearText:'This part of the sermon could not be recognized clearly.', ended:'The sermon has ended.', dua:'May Allah accept from us and from you.', rating:'How clear was the translation?', thanks:'Thank you.', replayBtn:'Read the sermon again', replayTitle:'Read the sermon again', back:'Back', backNow:'Latest', empty:'No temporary copy of the sermon is available.', loadFail:'Could not load the sermon.', failNote:'Machine translation is unavailable for this part; the Arabic text is shown.', unknownRoom:'This mosque link is not valid.', sura:'Surah', translationOf:'Translation of the meanings of the Noble Qur’an', privacy:'Privacy policy'},
  ur: {waiting:'خطبہ ابھی شروع نہیں ہوا۔', waitingSub:'یہ صفحہ کھلا رکھیں، ترجمہ خود بخود ظاہر ہوگا۔', connected:'منسلک', connecting:'منسلک ہو رہا ہے…', disconnected:'رابطہ منقطع', live:'براہِ راست', disc:'رابطہ منقطع ہو گیا، دوبارہ جوڑا جا رہا ہے۔', discSub:'آپ سے کچھ نہیں چھوٹے گا۔', disclaimer:'مصنوعی ذہانت کے ذریعے خودکار ترجمہ، اصل حوالہ خطیب کا کلام ہے۔', feedTitle:'خطبے کا ریکارڈ', now:'ابھی', quran:'قرآن', hadith:'حدیث، جیسا کہ خطیب نے بیان کی', unclear:'غیر واضح', unclearText:'خطبے کا یہ حصہ واضح طور پر پہچانا نہیں جا سکا۔', ended:'خطبہ ختم ہو گیا۔', dua:'اللہ ہم سے اور آپ سے قبول فرمائے۔', rating:'ترجمہ کتنا واضح تھا؟', thanks:'شکریہ۔', replayBtn:'خطبہ دوبارہ پڑھیں', replayTitle:'خطبہ دوبارہ پڑھیں', back:'واپس', backNow:'تازہ ترین', empty:'خطبے کی کوئی عارضی کاپی دستیاب نہیں۔', loadFail:'خطبہ لوڈ نہیں ہو سکا۔', failNote:'اس حصے کا خودکار ترجمہ دستیاب نہیں، عربی متن دکھایا جا رہا ہے۔', unknownRoom:'مسجد کا یہ لنک درست نہیں۔', sura:'سورۃ', translationOf:'قرآن کریم کے معانی کا ترجمہ', privacy:'رازداری کی پالیسی'},
  hi: {waiting:'ख़ुतबा अभी शुरू नहीं हुआ है।', waitingSub:'यह पेज खुला रखें, अनुवाद अपने आप दिखाई देगा।', connected:'जुड़ा हुआ', connecting:'जुड़ रहा है…', disconnected:'कनेक्शन टूट गया', live:'लाइव', disc:'कनेक्शन टूट गया, दोबारा जोड़ा जा रहा है।', discSub:'आपसे कुछ नहीं छूटेगा।', disclaimer:'AI द्वारा स्वचालित अनुवाद, मूल संदर्भ ख़तीब के शब्द हैं।', feedTitle:'ख़ुतबे का रिकॉर्ड', now:'अभी', quran:'क़ुरआन', hadith:'हदीस, जैसा ख़तीब ने बताया', unclear:'अस्पष्ट', unclearText:'ख़ुतबे का यह हिस्सा साफ़ पहचाना नहीं जा सका।', ended:'ख़ुतबा समाप्त हो गया।', dua:'अल्लाह हमसे और आपसे क़बूल फ़रमाए।', rating:'अनुवाद कितना स्पष्ट था?', thanks:'धन्यवाद।', replayBtn:'ख़ुतबा दोबारा पढ़ें', replayTitle:'ख़ुतबा दोबारा पढ़ें', back:'वापस', backNow:'नवीनतम', empty:'ख़ुतबे की कोई अस्थायी प्रति उपलब्ध नहीं है।', loadFail:'ख़ुतबा लोड नहीं हो सका।', failNote:'इस हिस्से का स्वचालित अनुवाद उपलब्ध नहीं, अरबी पाठ दिखाया जा रहा है।', unknownRoom:'मस्जिद का यह लिंक मान्य नहीं है।', sura:'सूरह', translationOf:'पवित्र क़ुरआन के अर्थों का अनुवाद', privacy:'गोपनीयता नीति'},
};
const SESSION_SCREENS = ['waiting', 'live', 'ended'];
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

let room = (params.get('room') || '').trim().toUpperCase();
let lang = store('minbar.lang');
let selected = lang || 'ar';
let ws = null, retry = 1000, retryTimer = null, pingTimer = null;
let status = 'READY', session = 0, lastSeq = 0, segments = [];
let current = null, returnTo = null, unknownRoom = false, serverUnreachable = false;
let font = 18;

// Language preference lives in sessionStorage only (cleared when the tab closes).
function store(key, value) {
  try {
    if (value === undefined) return sessionStorage.getItem(key);
    sessionStorage.setItem(key, value);
  } catch { return null; }
}
const t = key => (T[lang] || T.ar)[key] || T.ar[key] || '';

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const SVG = 'http://www.w3.org/2000/svg';
function icon(name, cls = '') {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('class', ('i ' + cls).trim());
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(SVG, 'use');
  use.setAttribute('href', 'assets/icons.svg#' + name);
  svg.append(use);
  return svg;
}
function badge(cls, name, text) {
  const b = el('span', 'badge ' + cls);
  b.append(icon(name), document.createTextNode(' ' + text));
  return b;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  current = id;
  window.scrollTo(0, id === 'live' ? document.body.scrollHeight : 0);
  updateNowButton();
}
const screenForStatus = () => status === 'LIVE' ? 'live' : status === 'ENDED' ? 'ended' : 'waiting';
const inSession = () => SESSION_SCREENS.includes(current);

function applyLang() {
  const L = LANGS[lang] || LANGS.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = t(n.dataset.t); });
  document.querySelectorAll('.js-lang-pill').forEach(b => { b.replaceChildren(icon('chevron-down', 'chev'), document.createTextNode(' ' + L.label + ' '), icon('globe')); });
  document.title = 'منبر — ' + (lang === 'ar' ? 'المصلّي' : L.label);
  renderStars(0);
  setConn(ws && ws.readyState === 1 ? 'connected' : 'connecting');
}

function setMosque(name, location) {
  document.querySelectorAll('.js-mosque-name').forEach(n => { n.textContent = name || ''; });
  document.querySelectorAll('.js-mosque-location').forEach(n => { n.textContent = location || ''; });
}

/* ── welcome ── */
function startGreeting() {
  const items = [['أهلاً بك', 'ar'], ['Welcome', 'en'], ['خوش آمدید', 'ur'], ['स्वागत है', 'hi']];
  const h = $('greeting');
  let i = 0;
  setInterval(() => {
    if (current !== 'welcome') return;
    h.classList.add('fade');
    setTimeout(() => {
      i = (i + 1) % items.length;
      h.textContent = items[i][0];
      h.className = 'lang-' + items[i][1] + ' fade';
      h.lang = items[i][1];
      requestAnimationFrame(() => h.classList.remove('fade'));
    }, 350);
  }, 2000);
}

/* ── language ── */
function goLanguage() {
  returnTo = inSession() || current === 'replay' ? current : null;
  selectLang(lang || selected);
  show('language');
}
function selectLang(l) {
  selected = l;
  document.querySelectorAll('.lang-option').forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle('selected', on);
    b.setAttribute('aria-checked', on);
  });
}
function confirmLanguage() {
  const changed = selected !== lang;
  lang = selected;
  store('minbar.lang', lang);
  applyLang();
  if (ws && ws.readyState === 1) {
    if (changed) ws.send(JSON.stringify({type: 'language', language: lang}));
    renderFeed();
    if (returnTo === 'replay') return showReplay();
    return show(returnTo || screenForStatus());
  }
  enterSession();
}
function enterSession() {
  applyLang();
  show(unknownRoom ? 'waiting' : screenForStatus());
  if (unknownRoom) return showUnknownRoom();
  if (serverUnreachable) return showServerUnreachable();
  connect();
}

/* ── connection ── */
function wsUrl() {
  const q = new URLSearchParams({role: 'listener', language: lang, since: lastSeq, session});
  return MINBAR.wsUrl('/ws/' + encodeURIComponent(room) + '?' + q);
}
function connect() {
  clearTimeout(retryTimer);
  if (unknownRoom) return;
  if (ws && ws.readyState <= 1) return;
  setConn('connecting');
  const sock = ws = new WebSocket(wsUrl());
  sock.onopen = () => {
    retry = 1000;
    setConn('connected');
    clearInterval(pingTimer);
    pingTimer = setInterval(() => { if (sock.readyState === 1) sock.send('{"type":"ping"}'); }, 25000);
  };
  sock.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } handle(m); };
  sock.onclose = e => {
    if (sock !== ws) return;
    clearInterval(pingTimer);
    if (e.code === 4404) { unknownRoom = true; return showUnknownRoom(); }
    setConn('disconnected');
    retryTimer = setTimeout(connect, retry + Math.random() * 500);
    retry = Math.min(retry * 2, 15000);
  };
}
function reconnectNow() {
  if (!lang || unknownRoom) return;
  if (!ws || ws.readyState > 1) { retry = 1000; connect(); }
}
addEventListener('online', reconnectNow);
document.addEventListener('visibilitychange', () => { if (!document.hidden) reconnectNow(); });

function setConn(state) {
  const dot = $('conn-dot');
  dot.className = 'dot' + (state === 'disconnected' ? ' red' : state === 'connecting' ? ' amber' : '');
  $('conn-text').textContent = t(state);
  $('live').classList.toggle('offline', state === 'disconnected');
}
function showServerUnreachable() {
  show('waiting');
  document.querySelector('#waiting [data-t=waiting]').textContent = t('disconnected');
  document.querySelector('#waiting [data-t=waitingSub]').textContent = MINBAR.offlineHint;
  setConn('disconnected');
}
function showUnknownRoom() {
  show('waiting');
  document.querySelector('#waiting [data-t=waiting]').textContent = t('unknownRoom');
  document.querySelector('#waiting [data-t=waitingSub]').textContent = '';
  setConn('disconnected');
}

function resetSession(newSession) {
  session = newSession || 0;
  segments = [];
  lastSeq = 0;
  $('feed').replaceChildren();
}

function handle(m) {
  switch (m.type) {
    case 'state':
      if (m.name) setMosque(m.name, m.location);
      if (m.session !== session) resetSession(m.session);
      status = m.status;
      if (inSession()) show(screenForStatus());
      break;
    case 'history':
      (m.segments || []).forEach(s => addSegment(s, false));
      if (current === 'live') scrollToLatest(false);
      break;
    case 'started':
      resetSession(m.session);
      status = 'LIVE';
      if (inSession()) show('live');
      break;
    case 'segment':
      status = 'LIVE';
      if (current === 'waiting') show('live');
      addSegment(m, true);
      break;
    case 'ended':
      status = 'ENDED';
      if (inSession()) show('ended');
      break;
    case 'error':
      if (m.code === 'unknown_room') { unknownRoom = true; showUnknownRoom(); }
      break;
  }
}

/* ── feed ── */
function addSegment(seg, live) {
  if (seg.seq <= lastSeq) return;
  lastSeq = seg.seq;
  segments.push(seg);
  const feed = $('feed');
  const follow = live && current === 'live' && atBottom();
  const card = renderSegment(seg, true);
  // The green "current" frame stays on the latest real sentence (not on unclear audio).
  if (card.classList.contains('current')) {
    feed.querySelectorAll('.sermon-card.current').forEach(prev => { prev.classList.remove('current'); prev.querySelector('.badge.now')?.remove(); });
  }
  feed.appendChild(card);
  if (follow) scrollToLatest(true);
  updateNowButton();
}
function renderFeed() {
  let lastReal = -1;
  segments.forEach((s, i) => { if (!s.is_unclear) lastReal = i; });
  $('feed').replaceChildren(...segments.map((s, i) => renderSegment(s, i === lastReal)));
}

function timeOf(ts) {
  try { return new Date(ts || Date.now()).toLocaleTimeString((LANGS[lang] || LANGS.ar).locale, {hour: 'numeric', minute: '2-digit'}); }
  catch { return ''; }
}
function textFor(seg) {
  if (lang === 'ar') return seg.arabic;
  return (seg.translations || {})[lang] || seg.arabic;
}

function renderSegment(seg, isCurrent) {
  const card = el('article', 'sermon-card');
  const meta = el('div', 'card-meta');
  const badges = el('div', 'badges');
  meta.append(badges, el('span', 'time', timeOf(seg.ts)));
  card.append(meta);
  const failed = lang !== 'ar' && (seg.failed_languages || []).includes(lang);

  if (seg.is_unclear) {
    card.classList.add('unclear');
    badges.append(badge('unclear', 'wave', t('unclear')));
    card.append(el('div', 'seg-text', t('unclearText')));
    return card;
  }

  if (seg.verse) {
    const v = seg.verse;
    card.classList.add('quran');
    const sura = lang === 'en' || lang === 'hi' ? (v.sura_name_en || v.sura_name) : v.sura_name;
    badges.append(badge('quran', 'book', t('quran')), el('span', 'sura-ref', `${t('sura')} ${sura} (${v.ayah})`));
    const ctx = v.context;
    const parts = (seg.parts || {})[lang];
    // Without an AI translation of the khateeb's surrounding words, show them in Arabic.
    const ctxText = key => {
      if (lang !== 'ar' && parts && parts[key]) return [parts[key], ''];
      return [ctx[key], 'ar'];
    };
    const addCtx = key => {
      if (!ctx || v.verse_only || !ctx[key]) return;
      const [text, l] = ctxText(key);
      const node = el('div', 'seg-text ctx', text);
      if (l) { node.lang = l; node.dir = 'rtl'; }
      card.append(node);
    };
    addCtx('before');
    const ar = el('div', 'card-quran', '﴿' + (v.arabic || seg.arabic) + '﴾');
    ar.lang = 'ar';
    card.append(ar);
    if (lang !== 'ar' && (v.translations || {})[lang]) {
      card.append(el('div', 'card-tr', v.translations[lang]));
      const src = (v.sources || {})[lang] || {};
      const source = el('div', 'card-source');
      source.append(icon('book'), document.createTextNode(` ${t('translationOf')} — ${lang === 'ur' && src.translator_ar ? src.translator_ar : (src.translator || '')} | QuranEnc`));
      card.append(source);
    } else if (lang === 'ar') {
      card.append(el('div', 'card-source', t('quranSource')));
    }
    addCtx('after');
    if (failed) card.append(el('div', 'fail-note', t('failNote')));
    if (isCurrent) { card.classList.add('current'); badges.prepend(badge('now', 'wave', t('now'))); }
    return card;
  }

  if (seg.is_hadith) badges.append(badge('hadith', 'book', t('hadith')));
  const body = el('div', 'seg-text', failed ? seg.arabic : textFor(seg));
  if (failed || lang === 'ar') { body.lang = 'ar'; body.dir = 'rtl'; }
  card.append(body);
  if (failed) card.append(el('div', 'fail-note', t('failNote')));
  if (isCurrent) { card.classList.add('current'); badges.prepend(badge('now', 'wave', t('now'))); }
  return card;
}

/* ── tools ── */
function changeFont(delta) {
  font = Math.max(16, Math.min(30, font + delta));
  document.documentElement.style.setProperty('--seg-font', font + 'px');
}
const atBottom = () => innerHeight + scrollY >= document.body.scrollHeight - 160;
function scrollToLatest(smooth = true) {
  window.scrollTo({top: document.body.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
}
function updateNowButton() {
  $('now-btn').classList.toggle('hidden', !(current === 'live' && segments.length && !atBottom()));
}
addEventListener('scroll', updateNowButton, {passive: true});

/* ── ended + replay ── */
function renderStars(n) {
  const box = $('stars');
  box.replaceChildren(...[1, 2, 3, 4, 5].map(i => {
    const b = el('button', 'star' + (i <= n ? ' on' : ''), '★');
    b.setAttribute('aria-label', String(i));
    b.onclick = () => { renderStars(i); $('thanks').textContent = t('thanks'); };
    return b;
  }));
}
async function showReplay() {
  show('replay');
  const box = $('replay-feed');
  box.replaceChildren(el('p', 'empty-note', '…'));
  let list = segments;
  try {
    const r = await fetch(MINBAR.url('/broadcast/' + encodeURIComponent(room) + '/replay'));
    if (r.ok) list = (await r.json()).segments || [];
  } catch {
    if (!list.length) { box.replaceChildren(el('p', 'empty-note', t('loadFail'))); return; }
  }
  box.replaceChildren(...(list.length ? list.map(s => renderSegment(s, false)) : [el('p', 'empty-note', t('empty'))]));
}
function leaveReplay() { show(ws ? screenForStatus() : 'ended'); }

/* ── boot ── */
async function init() {
  startGreeting();
  selectLang(selected);
  if (!room) {
    try { room = ((await (await fetch(MINBAR.url('/broadcast/mosques'))).json()).mosques[0] || {}).id || ''; } catch {}
  }
  try {
    const r = await fetch(MINBAR.url('/broadcast/' + encodeURIComponent(room)));
    if (r.status === 404) unknownRoom = true;
    else if (r.ok) { const s = await r.json(); setMosque(s.name, s.location); status = s.status; session = s.session; }
    else serverUnreachable = true;
  } catch { serverUnreachable = true; }

  if (params.get('replay')) {
    lang = lang || 'ar';
    applyLang();
    connect();
    return showReplay();
  }
  if (params.get('step') === 'language') return goLanguage();
  if (lang && LANGS[lang]) return enterSession();
  show('welcome');
}
init();
</script>
